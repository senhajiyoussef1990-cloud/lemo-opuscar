name: Render Papi serieux episode 8 V2
on:
  push:
    branches: [render/papi-serieux-ep8-v2-20261118]
    paths: [.github/workflows/render-papi-serieux-ep8.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout original series sources
        uses: actions/checkout@v4
        with:
          lfs: false
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install graphics and sound tools
        run: |
          sudo apt-get install -y -qq p7zip-full || true
          npm ci --no-audit --no-fund
          node node_modules/playwright-core/cli.js install chromium-headless-shell
          python -m venv .venv
          .venv/bin/python -m pip install -q -r requirements.txt edge-tts imageio-ffmpeg
          mkdir -p "$PWD/.local/bin"
          ln -s "$(.venv/bin/python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" "$PWD/.local/bin/ffmpeg"
          ln -s "$(command -v ffprobe)" "$PWD/.local/bin/ffprobe"
          echo "$PWD/.local/bin" >> "$GITHUB_PATH"
      - name: Generate original character voices and music
        env:
          LIB: ${{ github.workspace }}
        run: |
          set -eux
          ffmpeg -version | head -1
          sh films/papi-serieux-ep8/tools/fonts.sh
          sh films/papi-serieux-opening/tools/fonts.sh
          .venv/bin/python core/audio/sampler.py --need films/papi-serieux-ep8/music/score.py
          .venv/bin/python core/tts/tts_zh.py films/papi-serieux-ep8/lines.json films/papi-serieux-ep8/voice
          .venv/bin/python films/papi-serieux-ep8/tools/lip.py
          node core/render/events.mjs films/papi-serieux-ep8 --size 1080x1920
          .venv/bin/python films/papi-serieux-ep8/music/score.py
          .venv/bin/python films/papi-serieux-ep8/mix.py
      - name: Build V2 hook-opening-episode-outro
        env:
          LIB: ${{ github.workspace }}
        run: |
          set -eux
          SUB="Abonne-toi, petit. À demain pour l'épisode 9 !" sh films/papi-serieux-opening/assemble-v2.sh films/papi-serieux-ep8 3.5 "Demain — Épisode 9 : Le selfie" films/papi-serieux-ep8/papi-serieux-ep8-v2.mp4
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 films/papi-serieux-ep8/papi-serieux-ep8-v2.mp4
      - name: Upload completed film
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: papi-serieux-episode-8-v2
          path: |
            films/papi-serieux-ep8/papi-serieux-ep8-v2.mp4
            films/papi-serieux-ep8/papi-serieux-ep8-v2.srt
          if-no-files-found: warn
          retention-days: 14
