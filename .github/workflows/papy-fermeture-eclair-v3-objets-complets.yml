name: Le Livre de Papy - Fermeture eclair V3 objets complets sac bottes vestes
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/papy-fermeture-eclair-v3-objets-complets.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: papy-fermeture-eclair-v3-objets
  cancel-in-progress: false
jobs:
  fermeture-eclair:
    name: Fermeture eclair V3 - sac de Malik bottes vestes et mecanisme
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Charger la derniere branche Le Livre de Papy
        uses: actions/checkout@v4
        with:
          ref: le-livre-de-papy
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Installer Chromium
        run: |
          npm ci
          npx playwright-core install --with-deps chromium
      - name: Installer les outils de voix et de son
        run: python -m pip install --disable-pip-version-check -r requirements.txt edge-tts
      - name: Preflight DA V3 - 7 objets complets et changement reel du sac
        env:
          LEMO_ANGLE: swiftshader
        run: |
          set -euo pipefail
          python -m py_compile films/papy-batch5/prepare.py films/papy-batch5/audio_qc.py films/papy-batch5/visual_qc.py
          python films/papy-batch5/prepare.py fermeture-eclair
          d=films/papy-fermeture-eclair
          python -m py_compile "$d/tools/voice.py" "$d/tools/mix.py" "$d/tools/foley.py"
          node --check "$d/main.js"
          node --check "$d/story.js"
          node --check "$d/chars.js"
          node --check "$d/workshops.js"
          node --check "$d/objects.js"
          node --check "$d/people.js"
          node --check "$d/toon.js"
          grep -Fq "g.fillRect(0,0,W,128)" "$d/main.js"
          grep -Fq "m.holdF=Wd.heldObject(w,t)" "$d/main.js"
          grep -Fq "const sturdy=TYPE==='zipper'" "$d/workshops.js"
          grep -Fq "function zipperContext(kind,t)" "$d/workshops.js"
          grep -Fq "const bag=(closed=false,stuck=false)" "$d/objects.js"
          grep -Fq "const jacket=(proto=false)" "$d/objects.js"
          grep -Fq "Wd.homeObject(x+18,y-28,t,w)" "$d/main.js"
          grep -Fq "w1:[960,1090,1.72]" "$d/main.js"
          grep -Fq "four separate rounded fingers" "$d/chars.js"
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('films/papy-fermeture-eclair/episode.json').read_text())
          assert len(d['eras'])==7 and len(d['lines'])==39
          assert len(d['sources'])>=4
          print('PILOTE V3 OK : 7 epoque et objets complets, sac coince puis referme, 128 px et cinq doigts')
          PY
          bash "$d/tools/fonts.sh"
          node core/render/still.mjs "$d" 18 27 36 45 54 63 72 81 90 99 108 117 126 135 --size 1080x1920 --out "$d/preflight-vertical"
      - name: Produire MP4 TikTok 9x16 avec Papy et Malik, son et planche de 25 captures
        env:
          LEMO_ANGLE: swiftshader
          PYTHONUNBUFFERED: '1'
          FPS: '12'
          RENDER_WORKERS: '4'
        run: bash films/papy-batch5/build-vertical.sh fermeture-eclair
      - name: ZIP episode et controle 25 images
        uses: actions/upload-artifact@v4
        with:
          name: livre-de-papy-fermeture-eclair-v3-sacs-bottes-vestes-story-voix-25-controles
          path: films/papy-fermeture-eclair/le-livre-de-papy-fermeture-eclair-tiktok-vertical.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
