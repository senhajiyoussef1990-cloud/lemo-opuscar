name: Le Livre de Papy - Crayon TikTok 9x16 bande fine haute
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/papy-crayon-tiktok-fine-bande.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: papy-crayon-vertical-v5-uniquement
  cancel-in-progress: false
jobs:
  crayon:
    name: Crayon vertical uniquement - narration et bande des epoques en haut
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Charger la branche Le Livre de Papy
        uses: actions/checkout@v4
        with:
          ref: le-livre-de-papy
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Installer Chromium
        run: |
          npm ci
          npx playwright-core install --with-deps chromium
      - name: Installer les voix
        run: python -m pip install --disable-pip-version-check -r requirements.txt edge-tts
      - name: Preflight du crayon et de la bande historique fine
        env:
          LEMO_ANGLE: swiftshader
        run: |
          set -euo pipefail
          python -m py_compile films/papy-batch5/prepare.py films/papy-batch5/audio_qc.py
          python films/papy-batch5/prepare.py crayon
          d=films/papy-crayon
          python -m py_compile "$d/tools/voice.py" "$d/tools/mix.py"
          node --check "$d/main.js"
          node --check "$d/story.js"
          node --check "$d/workshops.js"
          node --check "$d/objects.js"
          node --check "$d/people.js"
          grep -Fq "g.fillRect(0,0,W,100)" "$d/main.js"
          grep -Fq "LE CRAYON" "$d/main.js"
          bash "$d/tools/fonts.sh"
          node core/render/still.mjs "$d" 15 55 95 --size 1080x1920 --out "$d/preflight-vertical"
      - name: Produire uniquement le MP4 TikTok 1080x1920 avec voix et controles son
        env:
          LEMO_ANGLE: swiftshader
          PYTHONUNBUFFERED: '1'
          FPS: '12'
          RENDER_WORKERS: '4'
        run: bash films/papy-batch5/build-vertical.sh crayon
      - name: Livrer uniquement le ZIP vertical du crayon
        uses: actions/upload-artifact@v4
        with:
          name: livre-de-papy-crayon-tiktok-vertical-bande-fine-story-voix-publications
          path: films/papy-crayon/le-livre-de-papy-crayon-tiktok-vertical.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
