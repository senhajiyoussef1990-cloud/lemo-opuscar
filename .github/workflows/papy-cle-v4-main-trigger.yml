name: Le Livre de Papy - Cles v4 correction sonore controle ameliore
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/papy-cle-v4-main-trigger.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: papy-v4-cle-seul-main-trigger
  cancel-in-progress: false
jobs:
  cle:
    name: Cles V4 seulement - tests images / audio et deux MP4
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Recuperer exclusivement la branche le-livre-de-papy
        uses: actions/checkout@v4
        with:
          ref: le-livre-de-papy
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Chromium
        run: |
          npm ci
          npx playwright-core install --with-deps chromium
      - name: Voix et audio
        run: python -m pip install --disable-pip-version-check -r requirements.txt edge-tts
      - name: Preflight de l'animation du cle en portrait et paysage
        env:
          LEMO_ANGLE: swiftshader
        run: |
          set -euo pipefail
          python films/papy-batch5/prepare.py cle
          d=films/papy-cle
          python -m py_compile "$d/tools/voice.py" "$d/tools/mix.py"
          node --check "$d/main.js"
          node --check "$d/workshops.js"
          node --check "$d/objects.js"
          node --check "$d/people.js"
          bash "$d/tools/fonts.sh"
          node core/render/still.mjs "$d" 15 55 95 --size 1080x1920 --out "$d/preflight-vertical"
          node core/render/still.mjs "$d" 15 55 95 --size 1920x1080 --q wide=1 --out "$d/preflight-horizontal"
      - name: Rendu uniquement cle avec anti-parasites et nouveau controle audio
        env:
          LEMO_ANGLE: swiftshader
          PYTHONUNBUFFERED: '1'
          FPS: '12'
          RENDER_WORKERS: '4'
        run: bash films/papy-batch5/build-dual.sh cle
      - name: Publier nouveau ZIP cle V4 pour revision
        uses: actions/upload-artifact@v4
        with:
          name: livre-de-papy-cle-v4-revision-audio-short-youtube
          path: films/papy-cle/le-livre-de-papy-cle-double-format.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
