name: Le Livre de Papy - Ciseaux V1 objets complets et ateliers
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/papy-ciseaux-v1-objets-complets.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: papy-ciseaux-vertical-v1
  cancel-in-progress: false
jobs:
  ciseaux:
    name: Ciseaux - 7 epoques, ciseaux reels, Papy et Malik, controle V2
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Charger la branche Le Livre de Papy
        uses: actions/checkout@v4
        with:
          ref: le-livre-de-papy
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Installer Chromium
        run: |
          npm ci
          npx playwright-core install --with-deps chromium
      - name: Installer les voix et outils
        run: python -m pip install --disable-pip-version-check -r requirements.txt edge-tts
      - name: Preflight ciseaux - sept objets complets et mains V2
        env:
          LEMO_ANGLE: swiftshader
        run: |
          set -euo pipefail
          python -m py_compile films/papy-batch5/prepare.py films/papy-batch5/visual_qc.py films/papy-batch5/audio_qc.py
          python films/papy-batch5/prepare.py ciseaux
          d=films/papy-ciseaux
          python -m py_compile "$d/tools/voice.py" "$d/tools/mix.py" "$d/tools/foley.py"
          node --check "$d/main.js"
          node --check "$d/story.js"
          node --check "$d/chars.js"
          node --check "$d/objects.js"
          node --check "$d/workshops.js"
          node --check "$d/people.js"
          node --check "$d/toon.js"
          grep -Fq "g.fillRect(0,0,W,128)" "$d/main.js"
          grep -Fq "L’HISTOIRE DES CISEAUX" "$d/main.js"
          grep -Fq "m.holdF=Wd.heldObject(w,t)" "$d/main.js"
          grep -Fq "four separate rounded fingers" "$d/chars.js"
          grep -Fq "function scissors(kind,era,t)" "$d/workshops.js"
          grep -Fq "const sturdy=TYPE==='zipper'||TYPE==='scissors'" "$d/workshops.js"
          grep -Fq "if(typ==='scissors')" "$d/objects.js"
          grep -Fq "w1:[960,1090,1.72]" "$d/main.js"
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('films/papy-ciseaux/episode.json').read_text())
          assert len(d['eras'])==7 and len(d['lines'])==39 and len(d['sources'])>=5
          assert d['type']=='scissors'
          assert 'dragon' in ' '.join(d['lines']).lower()
          print('OK: 39 répliques, 7 époques, outil complet, dragon, 128px, mains V2')
          PY
          bash "$d/tools/fonts.sh"
          node core/render/still.mjs "$d" 15 32 49 66 83 100 117 134 --size 1080x1920 --out "$d/preflight-vertical"
      - name: Rendu MP4 vertical 1080x1920 avec deux voix, story, planche QC
        env:
          LEMO_ANGLE: swiftshader
          PYTHONUNBUFFERED: '1'
          FPS: '12'
          RENDER_WORKERS: '4'
        run: bash films/papy-batch5/build-vertical.sh ciseaux
      - name: Artefact ZIP ciseaux avec MP4, Story et 25 photogrammes
        uses: actions/upload-artifact@v4
        with:
          name: livre-de-papy-ciseaux-v1-9x16-voix-story-25-controles
          path: films/papy-ciseaux/le-livre-de-papy-ciseaux-tiktok-vertical.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
