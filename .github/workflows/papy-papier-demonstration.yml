name: Le Livre de Papy - Papier demonstratif
on:
  push:
    branches: [le-livre-de-papy]
    paths: ['.github/workflows/papy-papier-demonstration.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    name: Papier - gestes artisans - Short et YouTube
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Chromium
        run: |
          npm ci
          npx playwright-core install --with-deps chromium
      - name: Audio et voix
        run: python -m pip install --disable-pip-version-check -r requirements.txt edge-tts
      - name: Preflight syntaxe et deux cadrages
        env:
          LEMO_ANGLE: swiftshader
        run: |
          python films/papy-batch5/prepare.py papier
          node --check films/papy-papier/objects.js
          node --check films/papy-papier/main.js
          bash films/papy-papier/tools/fonts.sh
          node core/render/still.mjs films/papy-papier 15 55 95 --size 1080x1920 --out films/papy-papier/preflight-9x16
          node core/render/still.mjs films/papy-papier 15 55 95 --size 1920x1080 --q wide=1 --out films/papy-papier/preflight-16x9
      - name: Produire deux MP4 narrés
        env:
          LEMO_ANGLE: swiftshader
          PYTHONUNBUFFERED: '1'
          FPS: '12'
          RENDER_WORKERS: '4'
        run: bash films/papy-batch5/build-dual.sh papier
      - name: Livrer ZIP Story et publications
        uses: actions/upload-artifact@v4
        with:
          name: livre-de-papy-papier-demonstratif-v2
          path: films/papy-papier/le-livre-de-papy-papier-double-format.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
