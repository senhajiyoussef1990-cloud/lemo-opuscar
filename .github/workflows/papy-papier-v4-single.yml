name: Le Livre de Papy - papier v4 uniquement - essais
on:
  push:
    branches: [le-livre-de-papy]
    paths:
      - .github/workflows/papy-papier-v4-single.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: papy-v4-papier-seul
  cancel-in-progress: false
jobs:
  papier:
    name: Papier v4 - corrections image et audio - Short et YouTube
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Chromium
        run: |
          npm ci
          npx playwright-core install --with-deps chromium
      - name: Voix et audio
        run: python -m pip install --disable-pip-version-check -r requirements.txt edge-tts
      - name: Preparation et tests papier 9x16 et 16x9
        env:
          LEMO_ANGLE: swiftshader
        run: |
          set -euo pipefail
          python films/papy-batch5/prepare.py papier
          d=films/papy-papier
          python -m py_compile "$d/tools/voice.py" "$d/tools/mix.py"
          node --check "$d/main.js"
          node --check "$d/workshops.js"
          node --check "$d/objects.js"
          node --check "$d/people.js"
          bash "$d/tools/fonts.sh"
          node core/render/still.mjs "$d" 15 55 95 --size 1080x1920 --out "$d/preflight-vertical"
          node core/render/still.mjs "$d" 15 55 95 --size 1920x1080 --q wide=1 --out "$d/preflight-wide"
      - name: Rendu papier seul et controle audio de chaque MP4
        env:
          LEMO_ANGLE: swiftshader
          PYTHONUNBUFFERED: '1'
          FPS: '12'
          RENDER_WORKERS: '4'
        run: bash films/papy-batch5/build-dual.sh papier
      - name: Livraison du nouveau ZIP papier v4
        uses: actions/upload-artifact@v4
        with:
          name: livre-de-papy-papier-v4-seul-audio-qc
          path: films/papy-papier/le-livre-de-papy-papier-double-format.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
