name: Le Livre de Papy - 10 nouveaux episodes
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/papy-10-episodes-maison.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: papy-dix-episodes-9x16
  cancel-in-progress: false
jobs:
  preflight:
    name: Preflight - dix scenarii, dix objets et 70 epoques
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: le-livre-de-papy
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer le navigateur de rendu
        run: |
          npm ci
          npx playwright-core install --with-deps chromium
          python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Verifier les scripts, la chronologie et des plans 9x16
        env:
          LEMO_ANGLE: swiftshader
        run: |
          set -euo pipefail
          python -m py_compile films/papy-batch5/prepare.py films/papy-batch5/audio_qc.py films/papy-batch5/visual_qc.py
          bash -n films/papy-batch5/build-vertical.sh
          slugs="telephone television appareil-photo refrigerateur machine-a-laver aspirateur fer-a-repasser telecommande micro-ondes seche-cheveux"
          for slug in $slugs; do
            python films/papy-batch5/prepare.py "$slug"
            d="films/papy-$slug"
            for js in main story objects workshops gadgets chars people toon; do node --check "$d/$js.js"; done
            grep -Fq "g.fillRect(0,0,W,128)" "$d/main.js"
            grep -Fq "four separate rounded fingers" "$d/chars.js"
            grep -Fq "m.holdF=Wd.heldObject(w,t)" "$d/main.js"
            grep -Fq "gadgetWorkshop(type,kind,era,t,progress,artisan)" "$d/workshops.js"
            python - "$d" <<'PY'
          from pathlib import Path
          import json,sys
          d=Path(sys.argv[1]); e=json.loads((d/'episode.json').read_text(encoding='utf8'))
          assert len(e['eras'])==7 and len(e['lines'])==39 and len(e['sources'])>=4
          assert e['title'].startswith("L'histoire")
          assert (d/'SCENARIO.md').exists() and (d/'publication.txt').exists()
          assert e['type'] in ('telephone','television','camera','fridge','washer','vacuum','iron','remote','microwave','hairdryer')
          print("PREFLIGHT",e['title'],"39 répliques, 7 époques")
          PY
            bash "$d/tools/fonts.sh"
            node core/render/still.mjs "$d" 15 48 --size 1080x1920 --out "$d/preflight-vertical"
          done
  episode_01:
    name: 1 - telephone - voix, Story et ZIP
    runs-on: ubuntu-latest
    timeout-minutes: 180
    needs: [preflight]
    if: ${{ always() && needs.preflight.result == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: le-livre-de-papy
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer navigateur et synthese vocale
        run: |
          sudo apt-get update -qq && sudo apt-get install -y ffmpeg
          npm ci
          npx playwright-core install --with-deps chromium
          python -m pip install --disable-pip-version-check -r requirements.txt edge-tts
      - name: Verifier telephone
        run: |
          python films/papy-batch5/prepare.py telephone
          d=films/papy-telephone
          for js in main story objects workshops gadgets chars people toon; do node --check "$d/$js.js"; done
          bash "$d/tools/fonts.sh"
      - name: Recuperer toutes les voix Papy et Malik avec 6 tentatives
        run: |
          set -euo pipefail
          d=films/papy-telephone
          for attempt in 1 2 3 4 5 6; do
            if python core/tts/tts_zh.py "$d/lines.json" "$d/raw"; then
              test -s "$d/raw/dur.json"
              break
            fi
            if [ "$attempt" -eq 6 ]; then echo "::error::Echec des voix apres 6 essais"; exit 1; fi
            sleep $((attempt * 7))
          done
      - name: Rendre telephone vertical avec les voix et 25 controles
        env:
          LEMO_ANGLE: swiftshader
          PYTHONUNBUFFERED: '1'
          FPS: '12'
          RENDER_WORKERS: '4'
        run: |
          set -euo pipefail
          bash films/papy-batch5/build-vertical.sh telephone
          python - <<'PY'
          from pathlib import Path
          import zipfile
          d=Path('films/papy-telephone')
          z=d/"L'histoire du téléphone.zip"
          assert (d/"L'histoire du téléphone.mp4").stat().st_size > 1_000_000
          with zipfile.ZipFile(z) as a:
              assert a.testzip() is None
              for part in ("L'histoire du téléphone.mp4","story.jpg","publication.txt","controles-visuels.jpg","SCENARIO.md","SOURCES.md"):
                  assert part in a.namelist(), (part,a.namelist())
          print('ARCHIVE VERIFIEE :',z)
          PY
      - name: Livrer L'histoire du téléphone
        uses: actions/upload-artifact@v4
        with:
          name: "L'histoire du téléphone"
          path: "films/papy-telephone/L'histoire du téléphone.zip"
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
