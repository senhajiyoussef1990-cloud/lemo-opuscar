name: Le Livre de Papy - 20 sujets initiaux - Lot 1 sur 2
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/papy-20-originaux-lot1.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: papy-20-ecole-lot1
  cancel-in-progress: false
jobs:
  preflight:
    name: Verifier 10 histoires / 70 epoques et les dessins de controle
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: le-livre-de-papy
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer les outils graphiques
        run: |
          npm ci
          npx playwright-core install --with-deps chromium
          python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Tester les scenarii et les images 9x16
        env:
          LEMO_ANGLE: swiftshader
        run: |
          set -euo pipefail
          python -m py_compile films/papy-batch5/prepare.py films/papy-batch5/audio_qc.py films/papy-batch5/visual_qc.py
          bash -n films/papy-batch5/build-vertical.sh
          for slug in stylo gomme cahier regle taille-crayon agrafeuse trombone ruban-adhesif colle calculatrice; do
            python films/papy-batch5/prepare.py "$slug"
            d="films/papy-$slug"
            for js in main story objects workshops school gadgets chars people toon; do node --check "$d/$js.js"; done
            grep -Fq "g.fillRect(0,0,W,128)" "$d/main.js"
            grep -Fq "four separate rounded fingers" "$d/chars.js"
            grep -Fq "m.holdF=Wd.heldObject(w,t)" "$d/main.js"
            grep -Fq "schoolWorkshop(type,kind,era,t,progress,artisan)" "$d/workshops.js"
            python - "$d" <<'PY'
          from pathlib import Path
          import json,sys
          d=Path(sys.argv[1]);e=json.loads((d/'episode.json').read_text(encoding='utf8'))
          assert e['title'].startswith("L'histoire")
          assert len(e['lines'])==39 and len(e['eras'])==7 and len(e['sources'])>=4
          assert e['type'] in ('pen','eraser','notebook','ruler','sharpener','stapler','paperclip','tape','glue','calculator')
          pub=(d/'publication.txt').read_text(encoding='utf8')
          assert '\n\n\n' in pub, 'two blank lines between texts are required'
          print("CONTROLE OK",e['title'])
          PY
            bash "$d/tools/fonts.sh"
            node core/render/still.mjs "$d" 15 48 --size 1080x1920 --out "$d/preflight-vertical"
          done
  episode_01:
    name: 01 - stylo - video, voix, Story, ZIP
    runs-on: ubuntu-latest
    timeout-minutes: 180
    needs: [preflight]
    if: ${{ always() && needs.preflight.result == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: le-livre-de-papy
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer les outils video et voix
        run: |
          sudo apt-get update -qq && sudo apt-get install -y ffmpeg
          npm ci
          npx playwright-core install --with-deps chromium
          python -m pip install --disable-pip-version-check -r requirements.txt edge-tts
      - name: Preparer l'histoire de stylo
        run: |
          python films/papy-batch5/prepare.py stylo
          d=films/papy-stylo
          for js in main story objects workshops school gadgets chars people toon; do node --check "$d/$js.js"; done
          bash "$d/tools/fonts.sh"
      - name: Synthese des 39 repliques avec reprises automatiques
        run: |
          set -euo pipefail
          d=films/papy-stylo
          for attempt in 1 2 3 4 5 6; do
            if python core/tts/tts_zh.py "$d/lines.json" "$d/raw"; then
              test -s "$d/raw/dur.json"
              break
            fi
            if [ "$attempt" -eq 6 ]; then echo "::error::Voix indisponibles apres 6 essais"; exit 1; fi
            sleep $((attempt * 7))
          done
      - name: Rendre vertical avec les deux voix, Story et 25 controles
        env:
          LEMO_ANGLE: swiftshader
          PYTHONUNBUFFERED: '1'
          FPS: '12'
          RENDER_WORKERS: '4'
        run: |
          set -euo pipefail
          bash films/papy-batch5/build-vertical.sh stylo
          python - <<'PY'
          from pathlib import Path
          import zipfile
          d=Path("films/papy-stylo")
          z=d/"L'histoire du stylo.zip"
          assert (d/"L'histoire du stylo.mp4").stat().st_size>1000000
          with zipfile.ZipFile(z) as a:
              assert a.testzip() is None
              for name in ["L'histoire du stylo.mp4","story.jpg","publication.txt","controles-visuels.jpg","SCENARIO.md","SOURCES.md"]:
                  assert name in a.namelist(), (name,a.namelist())
              assert '\n\n\n' in a.read("publication.txt").decode()
          print("ZIP vérifié:",z)
          PY
      - name: Livrer stylo
        uses: actions/upload-artifact@v4
        with:
          name: "L'histoire du stylo"
          path: "films/papy-stylo/L'histoire du stylo.zip"
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
