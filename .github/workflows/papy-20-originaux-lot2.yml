name: Le Livre de Papy - 20 sujets initiaux - Lot 2 sur 2
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/papy-20-originaux-lot2.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: papy-20-lot2-approved
  cancel-in-progress: false
jobs:
  preflight:
    name: Verifier les 10 scenarios et les 70 epoques en 9x16
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: le-livre-de-papy
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer les outils de controle visuel
        run: |
          npm ci
          npx playwright-core install --with-deps chromium
          python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Tests structuraux et 20 images de pre-rendu
        env:
          LEMO_ANGLE: swiftshader
        run: |
          set -euo pipefail
          python -m py_compile films/papy-batch5/prepare.py films/papy-batch5/audio_qc.py films/papy-batch5/visual_qc.py
          bash -n films/papy-batch5/build-vertical.sh
          for slug in radio ordinateur clavier souris-ordinateur microphone ventilateur grille-pain bouilloire robinet balai; do
            python films/papy-batch5/prepare.py "$slug"
            d="films/papy-$slug"
            for js in main story objects workshops gadgets school batch20b chars people toon; do node --check "$d/$js.js"; done
            grep -Fq "g.fillRect(0,0,W,128)" "$d/main.js"
            grep -Fq "four separate rounded fingers" "$d/chars.js"
            grep -Fq "m.holdF=Wd.heldObject(w,t)" "$d/main.js"
            grep -Fq "workshop20b(type,kind,era,t,progress,artisan)" "$d/workshops.js"
            python - "$d" <<'PY'
          from pathlib import Path
          import json,sys
          d=Path(sys.argv[1]);e=json.loads((d/'episode.json').read_text(encoding='utf8'))
          assert len(e['lines'])==39 and len(e['eras'])==7 and len(e['sources'])>=4
          assert e['type'] in ('radio','computer','keyboard','mouse','microphone','fan','toaster','kettle','faucet','broom')
          assert e['title'].startswith("L'histoire")
          assert '\n\n\n' in (d/'publication.txt').read_text(encoding='utf8')
          print("VALIDATION:",e['title'],"39 lignes, 7 scenes, publication aeree")
          PY
            bash "$d/tools/fonts.sh"
            node core/render/still.mjs "$d" 15 48 --size 1080x1920 --out "$d/preflight-vertical"
          done
  episode_01:
    name: 01 - radio - video, deux voix, Story, ZIP
    runs-on: ubuntu-latest
    timeout-minutes: 180
    needs: [preflight]
    if: ${{ always() && needs.preflight.result == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: le-livre-de-papy
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer outils video et voix
        run: |
          sudo apt-get update -qq && sudo apt-get install -y ffmpeg
          npm ci
          npx playwright-core install --with-deps chromium
          python -m pip install --disable-pip-version-check -r requirements.txt edge-tts
      - name: Preparer radio
        run: |
          python films/papy-batch5/prepare.py radio
          d="films/papy-radio"
          for js in main story objects workshops gadgets school batch20b chars people toon; do node --check "$d/$js.js"; done
          bash "$d/tools/fonts.sh"
      - name: Obtenir les 39 repliques avec 6 essais de reprise
        run: |
          set -euo pipefail
          d="films/papy-radio"
          for n in 1 2 3 4 5 6; do
            if python core/tts/tts_zh.py "$d/lines.json" "$d/raw"; then
              test -s "$d/raw/dur.json"
              break
            fi
            if [ "$n" -eq 6 ]; then echo "::error::Voix indisponibles apres 6 essais"; exit 1; fi
            sleep $((n * 7))
          done
      - name: Rendu vertical, 2 voix, effets et 25 controles
        env:
          LEMO_ANGLE: swiftshader
          PYTHONUNBUFFERED: '1'
          FPS: '12'
          RENDER_WORKERS: '4'
        run: |
          set -euo pipefail
          bash films/papy-batch5/build-vertical.sh radio
          python - <<'PY'
          from pathlib import Path
          import zipfile
          d=Path("films/papy-radio")
          z=d/"L'histoire de la radio.zip"
          assert (d/"L'histoire de la radio.mp4").stat().st_size > 1000000
          with zipfile.ZipFile(z) as a:
              assert a.testzip() is None
              for name in ["L'histoire de la radio.mp4","story.jpg","publication.txt","controles-visuels.jpg","SCENARIO.md","SOURCES.md"]:
                  assert name in a.namelist(), (name,a.namelist())
              assert '\n\n\n' in a.read('publication.txt').decode()
          print("LIVRABLE VERIFIE",z)
          PY
      - name: Publier ZIP radio
        uses: actions/upload-artifact@v4
        with:
          name: "L'histoire de la radio"
          path: "films/papy-radio/L'histoire de la radio.zip"
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
