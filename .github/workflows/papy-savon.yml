name: Le Livre de Papy - Savon (episode complet)
on:
  push:
    branches: [le-livre-de-papy]
    paths: ['.github/workflows/papy-savon.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  savon:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Navigateur Chromium
        run: |
          npm ci
          npx playwright-core install --with-deps chromium
      - name: Audio, voix et image
        run: python -m pip install --disable-pip-version-check -r requirements.txt edge-tts
      - name: Construire l'episode du savon, deux versions, Story, publication
        env:
          PYTHONUNBUFFERED: '1'
          LEMO_ANGLE: swiftshader
          FPS: '12'
          OUTPUT_FPS: '24'
          RENDER_WORKERS: '4'
        run: bash films/build-papy-episode.sh films/papy-savon savon "L'histoire du savon"
      - name: Publier le ZIP final
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: le-livre-de-papy-savon
          path: films/papy-savon/le-livre-de-papy-savon-livraison.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
