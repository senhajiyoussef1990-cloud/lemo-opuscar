name: Production Papi serieux episodes 08-11
on:
  push:
    branches: [production/papi-serieux-mains-episodes-08-11]
    paths: [.github/workflows/papi-episodes-08-11.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    strategy:
      fail-fast: false
      matrix:
        ep: [8, 9, 10, 11]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      LIB: ${{ github.workspace }}
      EP: ${{ matrix.ep }}
    steps:
      - name: Checkout de la serie originale
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer video, voix, musique
        run: |
          sudo apt-get install -y -qq ffmpeg
          npm ci --no-audit --no-fund
          node node_modules/playwright-core/cli.js install chromium-headless-shell
          python -m venv .venv
          .venv/bin/python -m pip install -q -r requirements.txt edge-tts imageio-ffmpeg
          mkdir -p "$PWD/.local/bin"
          ln -s "$(.venv/bin/python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" "$PWD/.local/bin/ffmpeg"
          ln -s "$(command -v ffprobe)" "$PWD/.local/bin/ffprobe"
          echo "$PWD/.local/bin" >> "$GITHUB_PATH"
      - name: Preparation des episodes
        run: |
          set -eu
          if [ "$EP" = 11 ]; then cp -r -n films/papi-serieux-ep10/. films/papi-serieux-ep11/; fi
          E="films/papi-serieux-ep${EP}"
          test -s "$E/parts.js" && test -s "$E/people.js" && test -s "$E/scenes.js" && test -s "$E/story.js"
          node --check "$E/parts.js"
          node --check "$E/scenes.js"
          node --check "$E/story.js"
      - name: Voix Henri Eloise et musique originale
        run: |
          set -eux
          E="films/papi-serieux-ep${EP}"
          sh "$E/tools/fonts.sh"
          sh films/papi-serieux-opening/tools/fonts.sh
          .venv/bin/python core/audio/sampler.py --need "$E/music/score.py"
          .venv/bin/python core/tts/tts_zh.py "$E/lines.json" "$E/voice"
          .venv/bin/python "$E/tools/lip.py"
          node core/render/events.mjs "$E" --size 1080x1920
          .venv/bin/python "$E/music/score.py"
          .venv/bin/python "$E/mix.py"
          E="$E" node --input-type=module <<'JS'
          import fs from 'node:fs';
          const d=process.env.E, m=await import('./'+d+'/story.js');
          fs.mkdirSync(d+'/out',{recursive:true});
          fs.writeFileSync(d+'/out/cues.json',JSON.stringify(m.SUBS.map(s=>({t0:s[0],t1:s[1],text:s.slice(2).join(' ')}))));
          JS
      - name: Montage V2 accroche generique episode et fin
        run: |
          set -eux
          E="films/papi-serieux-ep${EP}"
          H=$(E="$E" node --input-type=module -e "const m=await import('./'+process.env.E+'/story.js');process.stdout.write(String(m.CUTS[0]));")
          case "$EP" in
            8) NEXT="Demain — Épisode 9 : Le selfie"; TITLE="Les messages vocaux";;
            9) NEXT="Demain — Épisode 10 : La livraison"; TITLE="Le selfie";;
            10) NEXT="Demain — Épisode 11 : Les notifications"; TITLE="La livraison";;
            11) NEXT="Demain — Épisode 12 : Les QR codes"; TITLE="Les notifications";;
          esac
          SUB="Abonne-toi, petit. À demain pour l'épisode $((EP+1)) !" sh films/papi-serieux-opening/assemble-v2.sh "$E" "$H" "$NEXT" "$E/papi-serieux-ep${EP}-v2.mp4"
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 "$E/papi-serieux-ep${EP}-v2.mp4"
          sh films/papi-serieux-opening/make-card.sh "$EP" "$TITLE" "Aujourd'hui à 18 h"
      - name: Assemblage ZIP avec publications et visuel Story
        run: |
          set -eu
          mkdir -p PACKS
          .venv/bin/python - <<'PY'
          import os,zipfile
          n=int(os.environ['EP']); tag=f'EP{n:02d}'
          e=f'films/papi-serieux-ep{n}'
          video=f'{e}/papi-serieux-ep{n}-v2.mp4'
          srt=f'{e}/papi-serieux-ep{n}-v2.srt'
          pubs=f'films/papi-serieux-publications/ep{n}.md'
          card=f'films/papi-serieux-opening/cards/papi-serieux-ep{n}.jpg'
          dest=f'PACKS/Papi-serieux-{tag}-COMPLET.zip'
          for f in [video,srt,pubs,card]:
            if not os.path.isfile(f):raise SystemExit('Missing file: '+f)
          with zipfile.ZipFile(dest,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=5) as z:
            z.write(video,f'{tag}-Papi-serieux.mp4')
            z.write(srt,f'{tag}-sous-titres.srt')
            z.write(pubs,'PUBLICATIONS-RESEAUX.md')
            z.write(card,f'STORY_{tag}.jpg')
            z.writestr('LISEZ-MOI.txt',
              f'Papi, serieux ? - Episode {n}\nSource : moteur 2D retro GitHub.\n' +
              'Montage : accroche, opening, episode, outro, annonce du suivant.\n' +
              'Voix : Henri et Eloise. Gants corriges : 4 doigts et pouce.\n' +
              'MP4 1080x1920 et sous-titres SRT.\n')
          print(dest,os.path.getsize(dest))
          PY
      - name: Exporter le ZIP de l episode
        uses: actions/upload-artifact@v4
        with:
          name: Papi-serieux-EP${{ matrix.ep }}-COMPLET
          path: PACKS/Papi-serieux-EP*-COMPLET.zip
          if-no-files-found: error
          retention-days: 20
